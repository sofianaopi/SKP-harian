<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluasi Pimpinan – SAKTI</title>
<meta name="theme-color" content="#1F4E79">
<link rel="icon" href="icons/dashboard-192.png?v=2">
<link rel="apple-touch-icon" href="icons/dashboard-192.png?v=2">
<style>
  :root { --navy: #1F4E79; --biru: #1d63a6; --bg: #f3f6fa; --kartu: #fff; --teks: #0f172a; --teks2: #64748b; --teks3: #94a3b8; --garis: #e7ecf2; --hijau: #15803d; --kuning: #b45309; --r: 16px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--teks); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Kepala & tab ---------- */
  .kepala { position: sticky; top: 0; z-index: 20; background: linear-gradient(120deg, #173f66, #1F4E79 55%, #22629f); color: #fff; padding: 14px 18px 0; padding-top: calc(14px + env(safe-area-inset-top)); box-shadow: 0 6px 18px rgba(15,45,77,.18); }
  .k-atas { display: flex; align-items: center; gap: 12px; max-width: 1080px; margin: 0 auto; }
  .k-atas img { width: 36px; height: 36px; border-radius: 10px; background: #fff; }
  .k-atas h1 { margin: 0; font-size: 17px; letter-spacing: .2px; flex: 1; min-width: 0; } .k-atas h1 small { display: block; font-size: 12px; font-weight: 500; opacity: .78; }
  .k-av { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #fff; color: var(--navy); font-weight: 800; cursor: pointer; }
  .tab { display: flex; gap: 4px; max-width: 1080px; margin: 12px auto 0; overflow-x: auto; scrollbar-width: none; }
  .tab::-webkit-scrollbar { display: none; }
  .tab button { flex: 1 0 auto; border: 0; background: none; color: rgba(255,255,255,.75); padding: 10px 14px 12px; font-weight: 700; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab button.on { color: #fff; border-bottom-color: #fcd34d; }
  .menu-akun { position: absolute; right: 14px; top: calc(58px + env(safe-area-inset-top)); background: #fff; color: var(--teks); border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.2); padding: 8px; min-width: 230px; z-index: 30; }
  .menu-akun .ma-n { padding: 8px 10px 10px; border-bottom: 1px solid var(--garis); margin-bottom: 4px; } .menu-akun .ma-n b { display: block; } .menu-akun .ma-n small { color: var(--teks2); }
  .menu-akun a, .menu-akun button { display: block; width: 100%; text-align: left; padding: 10px; border: 0; background: none; border-radius: 9px; color: var(--teks); text-decoration: none; cursor: pointer; font-size: 14px; }
  .menu-akun a:hover, .menu-akun button:hover { background: #f1f5f9; } .menu-akun .keluar { color: #b42318; }

  main { max-width: 1080px; margin: 0 auto; padding: 16px 16px 40px; }
  .pane { max-width: 760px; margin: 0 auto; }

  /* ---------- Kontrol ---------- */
  .kontrol { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .geser { display: flex; align-items: center; background: #fff; border: 1px solid var(--garis); border-radius: 12px; overflow: hidden; flex: 1 1 260px; min-width: 0; }
  .geser button { border: 0; background: none; width: 44px; height: 44px; font-size: 20px; color: var(--teks2); cursor: pointer; flex: 0 0 auto; }
  .geser button:hover { background: #f1f5f9; } .geser button:disabled { opacity: .3; cursor: default; }
  .geser .lbl { flex: 1; text-align: center; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: inline-flex; background: #e9eef4; border-radius: 11px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 8px 12px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--teks2); cursor: pointer; }
  .seg button.on { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  select.saring { border: 1px solid var(--garis); background: #fff; border-radius: 12px; padding: 0 12px; height: 44px; font-weight: 600; font-size: 14px; color: var(--teks); max-width: 100%; }

  /* ---------- Strip 7 hari ---------- */
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  .strip button { border: 1px solid var(--garis); background: #fff; border-radius: 12px; padding: 7px 0 8px; cursor: pointer; text-align: center; }
  .strip button small { display: block; font-size: 11px; color: var(--teks2); font-weight: 600; } .strip button b { display: block; font-size: 17px; margin: 1px 0 4px; }
  .strip button i { display: block; height: 4px; border-radius: 99px; margin: 0 10px; background: #e2e8f0; overflow: hidden; } .strip button i em { display: block; height: 100%; background: #22c55e; }
  .strip button.on { background: var(--navy); border-color: var(--navy); color: #fff; } .strip button.on small { color: rgba(255,255,255,.8); } .strip button.on i { background: rgba(255,255,255,.25); } .strip button.on i em { background: #86efac; }
  .strip button.libur b { color: #94a3b8; } .strip button.on.libur b { color: #fff; }

  /* ---------- Ringkasan ---------- */
  .ringkas { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border: 1px solid var(--garis); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; }
  .ringkas > div { padding: 14px 10px; text-align: center; border-left: 1px solid var(--garis); } .ringkas > div:first-child { border-left: 0; }
  .ringkas b { display: block; font-size: 24px; letter-spacing: -.3px; } .ringkas span { font-size: 12px; color: var(--teks2); font-weight: 600; }
  .ringkas.empat { grid-template-columns: repeat(4, 1fr); }

  .chip-baris { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--garis); background: #fff; border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 700; color: var(--teks2); cursor: pointer; }
  .chip.on { background: #e8f0fa; border-color: #bcd3ee; color: var(--navy); } .chip em { font-style: normal; opacity: .7; margin-left: 3px; }

  /* ---------- Daftar pegawai ---------- */
  .daftar { background: #fff; border: 1px solid var(--garis); border-radius: var(--r); overflow: hidden; }
  .peg { border-top: 1px solid var(--garis); } .peg:first-child { border-top: 0; }
  .peg-kep { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; width: 100%; border: 0; background: none; text-align: left; }
  .peg-kep:hover { background: #f8fafc; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13.5px; color: #fff; flex: 0 0 auto; }
  .peg-nm { flex: 1; min-width: 0; } .peg-nm b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .peg-nm small { display: block; font-size: 12.5px; color: var(--teks2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jml { flex: 0 0 auto; text-align: right; } .jml b { display: block; font-size: 18px; line-height: 1.1; } .jml small { font-size: 11.5px; color: var(--teks2); }
  .jml.nol b { color: #cbd5e1; } .jml.nol small { color: #b45309; font-weight: 700; }
  .panah { width: 18px; color: #94a3b8; flex: 0 0 auto; transition: transform .2s; } .peg.buka .panah { transform: rotate(90deg); }
  .peg-isi { padding: 0 16px 14px 68px; }
  .keg { display: flex; gap: 12px; padding: 10px 0; border-top: 1px dashed #e8edf3; } .keg:first-child { border-top: 0; padding-top: 2px; }
  .keg time { flex: 0 0 46px; font-size: 12.5px; font-weight: 700; color: var(--teks2); padding-top: 1px; }
  .keg .tx { flex: 1; min-width: 0; font-size: 14px; } .keg .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 12px; color: var(--teks2); }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-weight: 700; font-size: 11.5px; }
  .tag.rk { background: #eef4fb; color: var(--navy); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tag.nork { background: #fff7ed; color: var(--kuning); } .tag.rentang { background: #f1f5f9; color: #475569; } .tag.gab { background: #f5f3ff; color: #6d28d9; }
  .foto-btn { border: 0; background: #f1f5f9; border-radius: 99px; padding: 1px 9px; font-size: 11.5px; font-weight: 700; color: #334155; cursor: pointer; }
  .kosong { text-align: center; color: var(--teks2); padding: 34px 16px; font-size: 14px; }

  /* ---------- Beban kerja ---------- */
  .ket-riil { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--teks2); background: #fff; border: 1px solid var(--garis); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  .bk-baris { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--garis); cursor: pointer; width: 100%; border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; }
  .bk-baris:first-child { border-top: 0; } .bk-baris:hover { background: #f8fafc; }
  .bk-tengah { flex: 1; min-width: 0; } .bk-tengah b { font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-bar { height: 7px; background: #eef2f6; border-radius: 99px; overflow: hidden; margin: 6px 0 5px; } .bk-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #1F4E79, #3b82c4); }
  .bk-meta { font-size: 12px; color: var(--teks2); display: flex; gap: 10px; flex-wrap: wrap; } .bk-meta b { display: inline; font-size: 12px; color: #334155; }
  .rank { width: 24px; text-align: center; font-weight: 800; color: #94a3b8; font-size: 13px; flex: 0 0 auto; }

  /* ---------- Per RK ---------- */
  .rk-baris { border-top: 1px solid var(--garis); } .rk-baris:first-child { border-top: 0; }
  .rk-kep { display: flex; gap: 12px; align-items: center; padding: 14px 16px; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; }
  .rk-kep:hover { background: #f8fafc; }
  .rk-bd { flex: 0 0 auto; font-size: 11px; font-weight: 800; color: var(--navy); background: #e8f0fa; border-radius: 8px; padding: 4px 7px; min-width: 64px; text-align: center; }
  .rk-nm { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rk-isi { padding: 0 16px 14px; }
  .iki { border: 1px solid #e8edf3; border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: #fbfcfe; }
  .iki-kep { display: flex; gap: 10px; align-items: flex-start; } .iki-kep .t { flex: 1; font-size: 13.5px; } .iki-kep .t small { display: block; font-size: 11px; font-weight: 800; color: var(--teks2); letter-spacing: .4px; }
  .kontrib { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .kontrib button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #e2e8f0; background: #fff; border-radius: 99px; padding: 3px 10px 3px 3px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .kontrib .av { width: 22px; height: 22px; font-size: 9.5px; }

  /* ---------- Lembar detail ---------- */
  .lembar-latar { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .lembar-latar.on { opacity: 1; pointer-events: auto; }
  .lembar { position: fixed; z-index: 41; background: var(--bg); display: flex; flex-direction: column; transition: transform .25s cubic-bezier(.2,.8,.2,1); right: 0; top: 0; bottom: 0; width: min(560px, 100%); transform: translateX(100%); box-shadow: -10px 0 40px rgba(0,0,0,.18); }
  .lembar.on { transform: none; }
  .lb-kep { background: #fff; border-bottom: 1px solid var(--garis); padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top)); display: flex; gap: 12px; align-items: center; }
  .lb-kep .tutup { border: 0; background: #f1f5f9; width: 38px; height: 38px; border-radius: 50%; font-size: 20px; cursor: pointer; flex: 0 0 auto; }
  .lb-kep .nm { flex: 1; min-width: 0; } .lb-kep .nm b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .lb-kep .nm small { color: var(--teks2); font-size: 12.5px; }
  .lb-isi { flex: 1; overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .lb-sub { font-size: 12px; font-weight: 800; letter-spacing: .5px; color: var(--teks2); text-transform: uppercase; margin: 18px 2px 8px; }
  .kal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; background: #fff; border: 1px solid var(--garis); border-radius: var(--r); padding: 12px; }
  .kal .h { font-size: 10.5px; color: var(--teks3); text-align: center; font-weight: 700; padding-bottom: 2px; }
  .kal .d { height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #94a3b8; background: #f8fafc; cursor: default; border: 0; }
  .kal .d.l1 { background: #dbeafe; color: #1e3a8a; } .kal .d.l2 { background: #93c5fd; color: #0c2a55; } .kal .d.l3 { background: #3b82f6; color: #fff; } .kal .d.l4 { background: #1e40af; color: #fff; }
  .kal .d.ada { cursor: pointer; } .kal .d.kosong-hari { visibility: hidden; }
  .kal-ket { display: flex; justify-content: flex-end; gap: 4px; align-items: center; font-size: 11px; color: var(--teks2); margin-top: 6px; } .kal-ket i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .pohon { background: #fff; border: 1px solid var(--garis); border-radius: var(--r); overflow: hidden; }
  .ph-rk { border-top: 1px solid var(--garis); } .ph-rk:first-child { border-top: 0; }
  .ph-kep { display: flex; gap: 10px; align-items: center; padding: 12px 14px; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; }
  .ph-kep .t { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; } .ph-kep .t small { display: block; font-weight: 600; font-size: 11.5px; color: var(--teks2); }
  .ph-n { flex: 0 0 auto; min-width: 30px; height: 26px; padding: 0 8px; border-radius: 99px; background: #eef4fb; color: var(--navy); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
  .ph-isi { padding: 0 14px 12px; }
  .ph-iki { margin-top: 6px; } .ph-iki > .lbl { font-size: 12.5px; font-weight: 700; color: #334155; padding: 6px 0; display: flex; gap: 8px; } .ph-iki > .lbl span { flex: 1; } .ph-iki > .lbl em { font-style: normal; color: var(--teks2); }
  .unit { display: flex; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #f8fafc; margin-bottom: 6px; font-size: 13.5px; }
  .unit .tx { flex: 1; min-width: 0; } .unit .tgl { font-size: 11.5px; color: var(--teks2); margin-top: 2px; }
  .unit .fr { flex: 0 0 auto; font-size: 12px; font-weight: 800; color: #6d28d9; }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
  .viewer.on { display: flex; } .viewer img { max-width: 100%; max-height: 78vh; border-radius: 10px; } .viewer .nav { color: #fff; font-size: 14px; display: flex; gap: 14px; align-items: center; }
  .viewer button { border: 0; background: rgba(255,255,255,.15); color: #fff; border-radius: 99px; padding: 8px 14px; cursor: pointer; font-weight: 700; }

  @media (min-width: 900px) {
    .lembar { width: 560px; }
  }
  @media (max-width: 560px) {
    main { padding: 12px 12px 32px; }
    .kepala { padding: 12px 14px 0; padding-top: calc(12px + env(safe-area-inset-top)); }
    .tab button { padding: 9px 10px 11px; font-size: 13.5px; }
    .ringkas b { font-size: 21px; } .ringkas span { font-size: 11px; } .ringkas.empat { grid-template-columns: repeat(2, 1fr); } .ringkas.empat > div:nth-child(3) { border-left: 0; } .ringkas.empat > div:nth-child(n+3) { border-top: 1px solid var(--garis); }
    .peg-kep, .bk-baris { padding: 12px 14px; } .peg-isi { padding: 0 14px 12px 14px; }
    .strip { gap: 4px; } .strip button b { font-size: 15px; }
    .lembar { width: 100%; }
  }
</style>
</head>
<body>
<header class="kepala">
  <div class="k-atas"><img src="icons/dashboard-192.png?v=2" alt=""><h1>Evaluasi Kegiatan Pegawai<small id="kSub">SAKTI · BPS Kota Kendari</small></h1><button class="k-av" id="kAv" type="button" aria-label="Menu akun">?</button></div>
  <nav class="tab" role="tablist"><button type="button" data-t="harian" class="on" role="tab">Kegiatan Harian</button><button type="button" data-t="beban" role="tab">Beban Kerja</button><button type="button" data-t="rk" role="tab">Per RK &amp; IKI</button></nav>
  <div class="menu-akun" id="menuAkun" hidden><div class="ma-n"><b id="maNama"></b><small>Pimpinan</small></div><a href="index.html?saya=1">Dashboard kegiatan saya</a><a href="input.html">Catat kegiatan saya</a><button type="button" class="keluar" id="maKeluar">Keluar</button></div>
</header>

<main>
  <!-- HARIAN -->
  <section id="t-harian" class="pane">
    <div class="kontrol">
      <div class="geser"><button type="button" id="hPrev" aria-label="Hari sebelumnya">‹</button><div class="lbl" id="hLbl"></div><button type="button" id="hNext" aria-label="Hari berikutnya">›</button></div>
      <select class="saring" id="hUnit" aria-label="Saring unit"></select>
    </div>
    <div class="strip" id="hStrip"></div>
    <div class="ringkas num" id="hRingkas"></div>
    <div class="chip-baris" id="hChip"></div>
    <div class="daftar" id="hDaftar"></div>
  </section>

  <!-- BEBAN KERJA -->
  <section id="t-beban" class="pane" hidden>
    <div class="kontrol">
      <div class="geser"><button type="button" id="bPrev" aria-label="Periode sebelumnya">‹</button><div class="lbl" id="bLbl"></div><button type="button" id="bNext" aria-label="Periode berikutnya">›</button></div>
      <div class="seg" id="bJenis"><button type="button" data-j="bulan" class="on">Bulan</button><button type="button" data-j="trw">Triwulan</button></div>
      <select class="saring" id="bUnit" aria-label="Saring unit"></select>
    </div>
    <div class="ringkas empat num" id="bRingkas"></div>
    <div class="ket-riil">ⓘ<span><b>Kegiatan riil:</b> kegiatan yang sama dihitung satu walau dicatat berkali-kali (seperti di dokumen Bukti Dukung). Ketuk nama pegawai untuk rinciannya.</span></div>
    <div class="daftar" id="bDaftar"></div>
  </section>

  <!-- PER RK -->
  <section id="t-rk" class="pane" hidden>
    <div class="kontrol">
      <div class="geser"><button type="button" id="rPrev" aria-label="Periode sebelumnya">‹</button><div class="lbl" id="rLbl"></div><button type="button" id="rNext" aria-label="Periode berikutnya">›</button></div>
      <select class="saring" id="rUnit" aria-label="Saring bidang"></select>
    </div>
    <div class="ringkas num" id="rRingkas"></div>
    <div class="daftar" id="rDaftar"></div>
  </section>
</main>

<div class="lembar-latar" id="lbLatar"></div>
<aside class="lembar" id="lembar" aria-hidden="true">
  <div class="lb-kep"><button class="tutup" type="button" id="lbTutup" aria-label="Tutup">×</button><span class="av" id="lbAv"></span><div class="nm"><b id="lbNama"></b><small id="lbSub"></small></div></div>
  <div class="lb-isi" id="lbIsi"></div>
</aside>
<div class="viewer" id="viewer"><img alt="Foto bukti"><div class="nav"><button type="button" id="vPrev">‹</button><span id="vPos"></span><button type="button" id="vNext">›</button><button type="button" id="vTutup">Tutup</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const S = window.SKP, $ = id => document.getElementById(id), esc = S.esc;
  const now = new Date(), HARI_INI = S.ymd(now);
  const WARNA = ['#2E75B6', '#059669', '#f97316', '#7c3aed', '#db2777', '#0891b2', '#ca8a04', '#4f46e5'];
  const inisial = n => String(n || '?').replace(/,.*$/, '').trim().split(/\s+/).map(w => w.replace(/\.+$/, '')).filter(w => w && !/^(hj|h|dr|ir|drs|dra|prof)$/i.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  const warna = n => { let s = 0; for (const c of String(n || '')) s = (s * 31 + c.charCodeAt(0)) >>> 0; return WARNA[s % WARNA.length]; };
  const avatar = (p, ukuran) => `<span class="av" style="background:${warna(p.nama)}${ukuran ? ';width:' + ukuran + 'px;height:' + ukuran + 'px' : ''}">${esc(inisial(p.nama))}</span>`;
  const geserTgl = (s, d) => { const t = S.parseYmd(s); t.setDate(t.getDate() + d); return S.ymd(t); };
  const tglPendek = s => { const d = S.parseYmd(s); return d.getDate() + ' ' + S.BULAN[d.getMonth()].slice(0, 3); };
  const normal = t => String(t || '').trim().replace(/\s+/g, ' ').toLowerCase();

  let pegawai = [], rkMap = new Map(), cache = new Map();
  let tab = 'harian', hTgl = HARI_INI, hFilter = 'semua', hBuka = null;
  let jenis = 'bulan', per = HARI_INI.slice(0, 7);   // 'YYYY-MM' (bulan) atau 'YYYY-Tn' (triwulan)
  let unitSaring = '';

  /* ---------- Periode ---------- */
  function periode() {
    if (jenis === 'bulan') { const [y, m] = per.split('-').map(Number); return { dari: per + '-01', sampai: per + '-' + S.pad(new Date(y, m, 0).getDate()), label: S.namaBulan(per) }; }
    const [y, t] = per.split('-T').map(Number); const m0 = (t - 1) * 3 + 1;
    return { dari: y + '-' + S.pad(m0) + '-01', sampai: y + '-' + S.pad(m0 + 2) + '-' + S.pad(new Date(y, m0 + 2, 0).getDate()), label: 'Triwulan ' + ['I', 'II', 'III', 'IV'][t - 1] + ' ' + y };
  }
  function geserPer(d) {
    if (jenis === 'bulan') { const [y, m] = per.split('-').map(Number); const t = new Date(y, m - 1 + d, 1); per = t.getFullYear() + '-' + S.pad(t.getMonth() + 1); }
    else { let [y, t] = per.split('-T').map(Number); t += d; if (t < 1) { t = 4; y--; } if (t > 4) { t = 1; y++; } per = y + '-T' + t; }
  }
  const perKini = () => jenis === 'bulan' ? HARI_INI.slice(0, 7) : HARI_INI.slice(0, 4) + '-T' + (Math.floor((now.getMonth()) / 3) + 1);

  /* ---------- Data ---------- */
  async function ambil(dari, sampai) {   // kegiatan aktif + arsip yang beririsan dengan rentang
    const k = dari + '|' + sampai; if (cache.has(k)) return cache.get(k);
    const c = S.client(); const awal = geserTgl(dari, -62);
    const [a, b] = await Promise.all([
      c.from('kegiatan').select('id,user_id,tanggal,tanggal_akhir,jam,teks,gabung,bidang,rk_id,foto').gte('tanggal', awal).lte('tanggal', sampai).limit(20000),
      c.from('kegiatan_arsip').select('*').gte('tanggal', awal).lte('tanggal', sampai).limit(20000)]);
    if (a.error) throw new Error(a.error.message);
    const rows = (a.data || []).map(r => ({ id: r.id, uid: r.user_id, tgl: r.tanggal, akhir: r.tanggal_akhir && r.tanggal_akhir > r.tanggal ? r.tanggal_akhir : r.tanggal, jam: r.jam || '', teks: r.teks || '', gabung: r.gabung || '', bidang: r.bidang || '', rk: r.rk_id || '', foto: Array.isArray(r.foto) ? r.foto : [], arsip: false }))
      .concat((b.error ? [] : b.data || []).map(r => ({ id: r.id, uid: r.user_id, tgl: r.tanggal, akhir: r.tanggal_akhir && r.tanggal_akhir > r.tanggal ? r.tanggal_akhir : r.tanggal, jam: r.jam || '', teks: r.teks || '', gabung: r.gabung || '', bidang: r.bidang || '', rk: r.rk_id || '', rkNama: r.rk_nama, iki: r.iki, foto: [], nFoto: r.foto || 0, arsip: true })))
      .filter(r => r.akhir >= dari && r.tgl <= sampai);
    cache.set(k, rows); return rows;
  }
  const rkInfo = r => { const x = rkMap.get(r.rk); if (x) return { nama: x.nama || '', iki: x.indikator || '', bidang: x.bidang || '' }; if (r.rkNama) return { nama: r.rkNama, iki: r.iki || '', bidang: r.bidang }; return null; };
  const pegTampil = () => pegawai.filter(p => !unitSaring || (p.unit || '') === unitSaring);
  /* Kegiatan riil: catatan dengan uraian sama atau uraian gabungan yang sama (per pegawai) dihitung satu */
  function satuan(rows) {
    const m = new Map();
    rows.forEach(r => { const k = r.uid + '|' + (normal(r.gabung || r.teks) || 'k:' + r.id); let u = m.get(k);
      if (!u) { u = { uid: r.uid, teks: r.gabung || r.teks, rows: [], rkHit: {} }; m.set(k, u); }
      u.rows.push(r); if (r.rk) u.rkHit[r.rk] = (u.rkHit[r.rk] || 0) + 1; });
    return [...m.values()].map(u => { u.dari = u.rows.map(r => r.tgl).sort()[0]; u.sampai = u.rows.map(r => r.akhir).sort().pop();
      const rkId = Object.entries(u.rkHit).sort((a, b) => b[1] - a[1])[0]; const r0 = rkId ? u.rows.find(r => r.rk === rkId[0]) : null;
      u.rk = r0 ? rkInfo(r0) : null; u.rkId = r0 ? r0.rk : ''; u.n = u.rows.length; u.foto = u.rows.reduce((a, r) => a + (r.arsip ? r.nFoto : r.foto.length), 0); return u; });
  }
  function hariDalam(rows, dari, sampai) { const set = new Set(); rows.forEach(r => { let d = r.tgl < dari ? dari : r.tgl; const e = r.akhir > sampai ? sampai : r.akhir; for (let i = 0; i < 70 && d <= e; i++) { set.add(d); d = geserTgl(d, 1); } }); return set; }
  const kunciRk = u => u.rk ? normal(u.rk.bidang) + '|' + normal(u.rk.nama) : '';

  function isiUnit() {
    const units = [...new Set(pegawai.map(p => p.unit).filter(Boolean))].sort();
    ['hUnit', 'bUnit', 'rUnit'].forEach(id => { $(id).innerHTML = '<option value="">Semua pegawai</option>' + units.map(u => `<option${u === unitSaring ? ' selected' : ''}>${esc(u)}</option>`).join(''); $(id).hidden = units.length < 2; });
  }

  /* ---------- Tab: Kegiatan harian ---------- */
  async function renderHarian() {

    $('hLbl').textContent = (hTgl === HARI_INI ? 'Hari ini · ' : '') + S.tglPanjang(hTgl);
    $('hNext').disabled = hTgl >= HARI_INI;
    const senin = geserTgl(hTgl, -((d.getDay() + 6) % 7)), minggu = geserTgl(senin, 6);
    const rows = await ambil(senin, minggu);

      .sort((a, b) => (per.get(b.id).length > 0) - (per.get(a.id).length > 0) || a.nama.localeCompare(b.nama));

      return `<div class="peg${buka ? ' buka' : ''}" data-p="${p.id}"><button type="button" class="peg-kep"${ks.length ? '' : ' disabled style="cursor:default"'}>${avatar(p)}<div class="peg-nm"><b>${esc(p.nama)}</b><small>${esc([p.jabatan, p.unit].filter(Boolean).join(' · ') || '—')}</small></div>
        <div class="jml num${ks.length ? '' : ' nol'}">${ks.length ? `<b>${ks.length}</b><small>kegiatan</small>` : '<small>Belum mencatat</small>'}</div>${ks.length ? '<svg class="panah" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>' : '<span class="panah"></span>'}</button>
        ${buka ? `<div class="peg-isi">${ks.map(r => { const rk = rkInfo(r), nf = r.arsip ? r.nFoto : r.foto.length;
          return `<div class="keg"><time class="num">${esc(r.jam || '—')}</time><div class="tx">${esc(r.gabung || r.teks)}<div class="meta">${rk ? `<span class="tag rk" title="${esc(rk.nama + (rk.iki ? ' — IKI: ' + rk.iki : ''))}">RK · ${esc(rk.nama.length > 46 ? rk.nama.slice(0, 44) + '…' : rk.nama)}</span>` : '<span class="tag nork">Belum ber-RK</span>'}${r.akhir > r.tgl ? `<span class="tag rentang">${esc(S.rentangTgl(r.tgl, r.akhir))}</span>` : ''}${nf ? (r.arsip ? `<span>📷 ${nf} (di Drive)</span>` : `<button type="button" class="foto-btn" data-foto="${r.id}">📷 ${nf}</button>`) : ''}</div></div></div>`; }).join('')}</div>` : ''}</div>`; }).join('')
      : `<div class="kosong">${hFilter === 'belum' ? '✓ Semua pegawai sudah mencatat kegiatan.' : 'Tidak ada data.'}</div>`;
  }
  $('hPrev').onclick = () => { hTgl = geserTgl(hTgl, -1); hBuka = null; render(); };
  $('hNext').onclick = () => { if (hTgl < HARI_INI) { hTgl = geserTgl(hTgl, 1); hBuka = null; render(); } };
  $('hStrip').onclick = e => { const b = e.target.closest('[data-t]'); if (!b || b.disabled) return; hTgl = b.dataset.t; hBuka = null; render(); };
  $('hChip').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; hFilter = b.dataset.f; render(); };
  $('hDaftar').onclick = async e => {
    const f = e.target.closest('[data-foto]'); if (f) { e.stopPropagation(); bukaFoto(f.dataset.foto); return; }
    const k = e.target.closest('.peg-kep'); if (!k || k.disabled) return; const id = k.closest('[data-p]').dataset.p; hBuka = hBuka === id ? null : id; await renderHarian();
    const el = document.querySelector(`[data-p="${id}"]`); if (el && hBuka) { const r = el.getBoundingClientRect(); if (r.top < 120) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  };

  /* ---------- Tab: Beban kerja ---------- */
  async function renderBeban() {
    const p = periode(); $('bLbl').textContent = p.label; $('bNext').disabled = per >= perKini();
    const P = pegTampil(), ids = new Set(P.map(x => x.id)); const rows = (await ambil(p.dari, p.sampai)).filter(r => ids.has(r.uid));
    const U = satuan(rows); const per1 = new Map(P.map(x => [x.id, { p: x, u: [], rows: [] }]));
    U.forEach(u => per1.get(u.uid).u.push(u)); rows.forEach(r => per1.get(r.uid).rows.push(r));
    const daftar = [...per1.values()].map(x => ({ ...x, n: x.u.length, rk: new Set(x.u.filter(u => u.rk).map(kunciRk)).size, iki: new Set(x.u.filter(u => u.rk).map(u => kunciRk(u) + '|' + normal(u.rk.iki))).size, hari: hariDalam(x.rows, p.dari, p.sampai).size }))
      .sort((a, b) => b.n - a.n || b.hari - a.hari || a.p.nama.localeCompare(b.p.nama));

      <div class="bk-meta num"><span><b>${x.rk}</b> RK</span><span><b>${x.iki}</b> IKI</span><span><b>${x.hari}</b> hari aktif</span>${x.u.some(u => !u.rk) ? `<span style="color:#b45309">${x.u.filter(u => !u.rk).length} tanpa RK</span>` : ''}</div></div>
      <div class="jml num${x.n ? '' : ' nol'}">${x.n ? `<b>${x.n}</b><small>kegiatan</small>` : '<small>Belum ada</small>'}</div></button>`).join('') : '<div class="kosong">Belum ada pegawai.</div>';
  }
  $('bPrev').onclick = () => { geserPer(-1); render(); }; $('bNext').onclick = () => { geserPer(1); render(); };
  $('rPrev').onclick = () => { geserPer(-1); render(); }; $('rNext').onclick = () => { geserPer(1); render(); };
  $('bJenis').onclick = e => { const b = e.target.closest('[data-j]'); if (!b || b.dataset.j === jenis) return; jenis = b.dataset.j; per = perKini(); $('bJenis').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); };
  $('bDaftar').onclick = e => { const b = e.target.closest('[data-p]'); if (b) bukaPegawai(b.dataset.p); };

  /* ---------- Lembar rincian per pegawai ---------- */

  async function bukaPegawai(id) {

    $('rDaftar').innerHTML = G.length ? G.map((g, gi) => { const pg = new Set(g.u.map(u => u.uid));
      const iki = new Map(); g.u.forEach(u => { const k = u.rk ? normal(u.rk.iki) : '~'; if (!iki.has(k)) iki.set(k, { nama: u.rk ? u.rk.iki : '', u: [] }); iki.get(k).u.push(u); });
      return `<div class="rk-baris"><button type="button" class="rk-kep" data-r="${gi}"><span class="rk-bd">${esc(g.rk ? (g.rk.bidang || '—') : 'Tanpa RK')}</span><span class="rk-nm">${g.rk ? esc(g.rk.nama) : '<span style="color:#b45309">Kegiatan belum dipasangkan RK</span>'}</span><div class="jml num"><b>${g.u.length}</b><small>${pg.size} pegawai</small></div></button>
        <div class="rk-isi" hidden>${[...iki.values()].sort((a, b) => b.u.length - a.u.length).map(ik => { const per2 = new Map(); ik.u.forEach(u => per2.set(u.uid, (per2.get(u.uid) || 0) + 1));
          return `<div class="iki"><div class="iki-kep"><div class="t">${g.rk ? '<small>IKI</small>' + esc(ik.nama || '—') : 'Kegiatan per pegawai'}</div><span class="ph-n num">${ik.u.length}</span></div>
            <div class="kontrib">${[...per2.entries()].sort((a, b) => b[1] - a[1]).map(([uid, n]) => { const pe = pegawai.find(x => x.id === uid) || { nama: '?' }; return `<button type="button" data-peg="${uid}">${avatar(pe)}${esc(pe.nama.split(/[ ,]/)[0])} <b class="num">${n}</b></button>`; }).join('')}</div></div>`; }).join('')}</div></div>`; }).join('')
      : '<div class="kosong">Belum ada kegiatan pada periode ini.</div>';
    $('rRingkas').title = nPeg + ' pegawai berkontribusi';
  }
  $('rDaftar').onclick = e => { const b = e.target.closest('[data-peg]'); if (b) { bukaPegawai(b.dataset.peg); return; } const r = e.target.closest('[data-r]'); if (r) { const isi = r.nextElementSibling; isi.hidden = !isi.hidden; } };

  /* ---------- Foto bukti ---------- */
  let vFoto = [], vI = 0;
  async function bukaFoto(kid) {
    const rows = [...cache.values()].flat(); const r = rows.find(x => x.id === kid); if (!r || !r.foto.length) return;
    vFoto = r.foto.map(id => ({ uid: r.uid, id })); vI = 0; $('viewer').classList.add('on'); tampilFoto();
  }
  async function tampilFoto() {
    const f = vFoto[vI]; const img = $('viewer').querySelector('img'); img.src = ''; $('vPos').textContent = (vI + 1) + ' / ' + vFoto.length;
    try { const r = await S.client().storage.from('bukti').download(f.uid + '/' + f.id + '.jpg'); if (r.error || !r.data) throw new Error('Foto tidak dapat dimuat'); img.src = URL.createObjectURL(r.data); }
    catch (x) { S.toast(x.message); }
  }
  $('vPrev').onclick = () => { vI = (vI - 1 + vFoto.length) % vFoto.length; tampilFoto(); }; $('vNext').onclick = () => { vI = (vI + 1) % vFoto.length; tampilFoto(); };
  $('vTutup').onclick = () => $('viewer').classList.remove('on'); $('viewer').onclick = e => { if (e.target === $('viewer')) $('viewer').classList.remove('on'); };

  /* ---------- Navigasi ---------- */
  function pilihTab(t) { tab = t; document.querySelectorAll('.tab [data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t)); ['harian', 'beban', 'rk'].forEach(x => $('t-' + x).hidden = x !== t); window.scrollTo(0, 0); render(); }
  document.querySelector('.tab').onclick = e => { const b = e.target.closest('[data-t]'); if (b) pilihTab(b.dataset.t); };
  ['hUnit', 'bUnit', 'rUnit'].forEach(id => $(id).onchange = () => { unitSaring = $(id).value; isiUnit(); render(); });
  async function render() {
    try { if (tab === 'harian') await renderHarian(); else if (tab === 'beban') await renderBeban(); else await renderRk(); }
    catch (x) { S.toast(/arsip|relation|schema/i.test(x.message) ? 'Database belum diperbarui: minta admin menjalankan setup.sql terbaru.' : x.message, 6000); }
  }
  $('kAv').onclick = e => { e.stopPropagation(); $('menuAkun').hidden = !$('menuAkun').hidden; };
  document.addEventListener('click', e => { if (!e.target.closest('#menuAkun')) $('menuAkun').hidden = true; });
  $('maKeluar').onclick = () => S.keluar();
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { tutupLembar(); $('viewer').classList.remove('on'); } });

  S.mulai({ pimpinan: true }).then(async ({ pegawai: saya }) => {
    $('kAv').textContent = inisial(saya.nama); $('maNama').textContent = saya.nama; $('kSub').textContent = 'SAKTI · ' + (S.config.NAMA_INSTANSI || 'BPS Kota Kendari');
    try {
      const [p, r] = await Promise.all([S.client().from('pegawai').select('id,nama,jabatan,unit,peran,aktif').order('nama'), S.client().from('rk').select('id,nama,indikator,bidang')]);
      pegawai = S.cek(p).filter(x => x.peran === 'pegawai' && x.aktif); (S.cek(r) || []).forEach(x => rkMap.set(x.id, x));
    } catch (x) { S.toast(x.message, 6000); }
    isiUnit(); render();
  });
})();
</script>
</body>
</html>
