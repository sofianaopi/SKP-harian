<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Catat Kegiatan – SKP Harian</title>
<meta name="theme-color" content="#008069">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catat SKP">
<link rel="manifest" href="manifest-input.json">
<link rel="icon" href="icons/input-192.png">
<link rel="apple-touch-icon" href="icons/input-192.png">
<style>
  :root { --hijau:#008069; --hijau-tua:#005c4b; --kirim:#00a884; --gel:#d9fdd3; --bg:#efeae2; --teks:#111b21; --abu:#667781; --biru:#53bdeb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--teks); background: var(--bg); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { background: var(--hijau); color: #fff; display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 8px; padding-top: calc(8px + env(safe-area-inset-top)); flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.15); z-index: 5; }
  .ikon-btn { background: none; border: 0; color: inherit; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; text-decoration: none; }
  .ikon-btn:active { background: rgba(255,255,255,.15); }
  .ikon-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #dfe5e7; color: var(--hijau); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .judul { flex: 1; min-width: 0; line-height: 1.2; }
  .judul b { display: block; font-size: 17px; font-weight: 600; }
  .judul small { display: block; font-size: 12.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tglPick { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

  #chat { flex: 1; overflow-y: auto; padding: 10px 12px 14px; background-color: var(--bg);
    background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1.5px), radial-gradient(rgba(0,0,0,.025) 1px, transparent 1.5px);
    background-size: 26px 26px, 26px 26px; background-position: 0 0, 13px 13px; overscroll-behavior: contain; }
  .tgl-chip { position: sticky; top: 4px; z-index: 2; margin: 10px auto; width: max-content; max-width: 90%; background: #fff; color: #54656f; font-size: 12.5px; padding: 5px 12px; border-radius: 8px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .info { margin: 10px auto 14px; max-width: 420px; background: #ffeecd; color: #54656f; font-size: 13px; line-height: 1.45; padding: 8px 12px; border-radius: 8px; text-align: center; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .gel { position: relative; margin: 2px 0 2px auto; width: fit-content; max-width: min(82%, 520px); background: var(--gel); border-radius: 8px; padding: 6px 8px 8px 9px; box-shadow: 0 1px .5px rgba(11,20,26,.13); cursor: pointer; animation: muncul .18s ease-out; display: flow-root; }
  .gel.ekor { border-top-right-radius: 0; margin-top: 8px; }
  .gel.ekor::after { content: ""; position: absolute; top: 0; right: -8px; border-width: 0 0 10px 8px; border-style: solid; border-color: transparent transparent transparent var(--gel); }
  .gel:active { filter: brightness(.96); }
  @keyframes muncul { from { transform: translateY(6px); opacity: 0; } }
  .gel .tag { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--hijau-tua); background: rgba(0,128,105,.1); border-radius: 6px; padding: 2px 7px; margin-bottom: 4px; max-width: 100%; }
  .gel .tag span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .gel .tag em { font-style: normal; flex-shrink: 0; }
  [hidden] { display: none !important; }
  .gel .isi { font-size: 14.6px; line-height: 1.38; white-space: pre-wrap; word-wrap: break-word; }
  .gel .meta { float: right; margin: 6px 0 -4px 12px; font-size: 11px; color: var(--abu); display: inline-flex; align-items: center; gap: 3px; position: relative; top: 4px; }
  .gel .meta svg { width: 16px; height: 11px; fill: var(--biru); }
  .gel .fotos { display: grid; gap: 3px; margin: -2px -4px 6px -5px; border-radius: 6px; overflow: hidden; }
  .gel .fotos.n1 { grid-template-columns: 1fr; } .gel .fotos.n2, .gel .fotos.n4 { grid-template-columns: 1fr 1fr; } .gel .fotos.n3 { grid-template-columns: 1fr 1fr 1fr; }
  .gel .fotos img, .gel .fotos .ph { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #c8d8c4; }
  .gel .fotos.n1 img, .gel .fotos.n1 .ph { aspect-ratio: auto; max-height: 300px; min-height: 120px; width: 260px; max-width: 100%; }

  #bawah { flex-shrink: 0; background: transparent; padding: 0 6px calc(6px + env(safe-area-inset-bottom)); }
  #banner { display: none; align-items: center; gap: 8px; background: #fff7d6; color: #6b5300; font-size: 13px; padding: 7px 10px; border-radius: 10px; margin: 0 2px 6px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  #banner.on { display: flex; } #banner span { flex: 1; } #banner button { border: 0; background: #6b5300; color: #fff; border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
  #chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 7px; scrollbar-width: none; }
  #chips::-webkit-scrollbar, #bidang::-webkit-scrollbar { display: none; }
  #bidang { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
  .bd { flex-shrink: 0; border: 0; background: rgba(0,128,105,.1); color: var(--hijau-tua); font: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .bd.on { background: var(--hijau-tua); color: #fff; }
  .chip.baru { border-style: dashed; color: var(--hijau); font-weight: 600; }
  .chip { flex-shrink: 0; border: 1px solid #d1d7db; background: #fff; color: #3b4a54; font-size: 13px; padding: 6px 11px; border-radius: 16px; cursor: pointer; max-width: 230px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: inherit; }
  .chip.on { background: var(--hijau); border-color: var(--hijau); color: #fff; }
  .chip.atur { border-style: dashed; color: var(--hijau); }
  #jml { display: none; align-items: center; gap: 0; flex-shrink: 0; background: #fff; border: 1px solid #d1d7db; border-radius: 16px; overflow: hidden; font-size: 13px; }
  #jml.on { display: inline-flex; }
  #jml button { border: 0; background: none; width: 30px; height: 30px; font-size: 17px; color: var(--hijau); cursor: pointer; }
  #jml b { min-width: 46px; text-align: center; font-weight: 600; }
  #pratinjau { display: none; gap: 6px; padding: 6px 2px 8px; overflow-x: auto; }
  #pratinjau.on { display: flex; }
  #pratinjau div { position: relative; flex-shrink: 0; }
  #pratinjau img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; display: block; border: 2px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  #pratinjau button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: #3b4a54; color: #fff; font-size: 14px; line-height: 22px; padding: 0; cursor: pointer; }
  .bar { display: flex; align-items: flex-end; gap: 6px; }
  .kolom { flex: 1; display: flex; align-items: flex-end; background: #fff; border-radius: 24px; padding: 3px 4px 3px 12px; min-height: 48px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .kolom textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; font-size: 16px; line-height: 1.35; padding: 11px 0; max-height: 140px; background: transparent; color: var(--teks); }
  .kolom .ikon-btn { color: #54656f; width: 42px; height: 42px; }
  #kirim { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--kirim); color: #fff; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  #kirim:disabled { opacity: .6; }
  #kirim svg { width: 22px; height: 22px; fill: #fff; margin-left: 2px; }

  .lapis { position: fixed; inset: 0; background: rgba(11,20,26,.45); display: none; z-index: 20; align-items: flex-end; justify-content: center; }
  .lapis.on { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow-y: auto; animation: naik .2s ease-out; }
  @keyframes naik { from { transform: translateY(40px); opacity: .4; } }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .sheet label { display: block; font-size: 12.5px; color: var(--abu); margin: 10px 0 4px; }
  .sheet textarea, .sheet input, .sheet select { width: 100%; font: inherit; font-size: 15px; padding: 10px; border: 1px solid #d1d7db; border-radius: 8px; background: #fff; color: var(--teks); }
  .sheet textarea { min-height: 90px; resize: vertical; }
  .baris { display: flex; gap: 10px; } .baris > div { flex: 1; min-width: 0; }
  .aksi { display: flex; gap: 8px; margin-top: 16px; }
  .aksi button { flex: 1; padding: 12px; font: inherit; font-size: 15px; font-weight: 600; border-radius: 10px; border: 0; cursor: pointer; }
  .b-utama { background: var(--hijau); color: #fff; } .b-hapus { background: #fde8e8; color: #c62828; } .b-batal { background: #f0f2f5; color: #3b4a54; }
  .fotoedit { display: flex; gap: 6px; flex-wrap: wrap; } .fotoedit img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 30; align-items: center; justify-content: center; }
  #viewer.on { display: flex; } #viewer img { max-width: 100%; max-height: 100%; }
  #skp-toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #3b4a54; color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: .2s; z-index: 40; max-width: 90%; text-align: center; }
  #skp-toast.show { opacity: 1; transform: translateX(-50%); }
  #pasang { display: none; } #pasang.on { display: grid; }
  @media (min-width: 900px) { #chat { padding-left: 12%; padding-right: 12%; } #bawah { padding-left: calc(12% - 6px); padding-right: calc(12% - 6px); } }
</style>
</head>
<body>
<header>
  <a class="ikon-btn" href="index.html" title="Buka Dashboard" aria-label="Buka Dashboard"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></a>
  <div class="avatar">SKP</div>
  <div class="judul"><b>Catatan Kegiatan</b><small id="sub">memuat…</small></div>
  <button class="ikon-btn" id="pasang" title="Pasang aplikasi" aria-label="Pasang aplikasi"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
  <button class="ikon-btn" id="btnTgl" title="Catat untuk tanggal lain" aria-label="Pilih tanggal"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/></svg></button>
  <input type="date" id="tglPick" aria-hidden="true" tabindex="-1">
</header>

<main id="chat" aria-live="polite"></main>

<div id="bawah">
  <div id="banner"><span id="bannerTeks"></span><button id="bannerX">Hari ini</button></div>
  <div id="bidang" role="tablist" aria-label="Bidang"></div>
  <div id="chips" aria-label="Jenis kegiatan"></div>
  <div id="pratinjau"></div>
  <div class="bar">
    <div class="kolom">
      <textarea id="teks" rows="1" placeholder="Ketik kegiatan hari ini…" aria-label="Uraian kegiatan"></textarea>
      <button class="ikon-btn" id="btnLampir" title="Lampirkan foto bukti" aria-label="Lampirkan foto"><svg viewBox="0 0 24 24"><path d="M16.5 6.5v10.6a4.5 4.5 0 0 1-9 0V5.5a3 3 0 0 1 6 0v10.4a1.5 1.5 0 0 1-3 0V6.5H9v9.4a3 3 0 0 0 6 0V5.5a4.5 4.5 0 0 0-9 0v11.6a6 6 0 0 0 12 0V6.5h-1.5z"/></svg></button>
      <button class="ikon-btn" id="btnKamera" title="Ambil foto" aria-label="Ambil foto"><svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.2 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.2L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></button>
    </div>
    <button id="kirim" aria-label="Kirim"><svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg></button>
  </div>
  <input type="file" id="fileGaleri" accept="image/*" multiple hidden>
  <input type="file" id="fileKamera" accept="image/*" capture="environment" hidden>
</div>

<div class="lapis" id="lapisEdit"><div class="sheet" role="dialog" aria-label="Ubah kegiatan">
  <h3>Ubah kegiatan</h3>
  <label for="eTeks">Uraian kegiatan</label><textarea id="eTeks"></textarea>
  <div class="baris"><div><label for="eTgl">Tanggal</label><input type="date" id="eTgl"></div><div><label for="eJam">Jam</label><input type="time" id="eJam"></div></div>
  <div class="baris"><div><label for="eBidang">Bidang</label><select id="eBidang"></select></div><div><label for="eJenis">Jenis kegiatan</label><select id="eJenis"></select></div></div>
  <div id="eRkBox"><label for="eRhk">Rencana Kinerja (RK) — opsional</label><select id="eRhk"></select>
  <label for="eJml">Jumlah output</label><input type="number" id="eJml" min="1" step="1"></div>
  <label>Foto bukti</label><div class="fotoedit" id="eFoto"></div>
  <div class="aksi"><button class="b-hapus" id="eHapus">Hapus</button><button class="b-batal" id="eBatal">Batal</button><button class="b-utama" id="eSimpan">Simpan</button></div>
  <div class="aksi" id="konfirmasi" style="display:none"><button class="b-batal" id="kTidak">Tidak jadi</button><button class="b-hapus" id="kYa" style="background:#c62828;color:#fff">Ya, hapus kegiatan ini</button></div>
</div></div>
<div class="lapis" id="lapisJenis"><div class="sheet" role="dialog" aria-label="Jenis kegiatan baru">
  <h3>Jenis kegiatan baru — <span id="jBidang"></span></h3>
  <label for="jNama">Nama jenis kegiatan</label><input id="jNama" placeholder="mis. Penghitungan PDRB Pengeluaran Triwulanan">
  <div style="font-size:12.5px;color:#667781;margin-top:6px">Satu jenis kegiatan = satu dokumen Bukti Dukung. Daftar ini dipakai bersama oleh semua pegawai.</div>
  <div class="aksi"><button class="b-batal" id="jBatal">Batal</button><button class="b-utama" id="jSimpan">Tambahkan</button></div>
</div></div>
<div id="viewer"><img alt="Foto bukti"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const S = window.SKP, $ = id => document.getElementById(id);
  let rhkList = [], jenisList = [], kegiatan = [], profil = {}, pilihBidang = null, pilihJenis = null, tglCatat = null, lampiran = [], editing = null;
  const fotoCache = new Map();

  try { const v = JSON.parse(localStorage.getItem('skp-input-pref') || '{}'); pilihBidang = v.bidang || null; pilihJenis = v.jenis || null; } catch (e) { }
  const simpanPref = () => { try { localStorage.setItem('skp-input-pref', JSON.stringify({ bidang: pilihBidang, jenis: pilihJenis })); } catch (e) { } };
  const jenisById = id => jenisList.find(j => j.id === id);

  async function muat() {
    [rhkList, jenisList, kegiatan, profil] = await Promise.all([S.list('rhk'), S.list('jenis'), S.list('kegiatan'), S.profil()]);
    rhkList.sort((a, b) => (a.urutan || 0) - (b.urutan || 0));
    if (!pilihBidang) pilihBidang = S.BIDANG.find(b => (profil.unit || '').toLowerCase().includes(b.toLowerCase())) || null;
    if (pilihJenis && !(jenisById(pilihJenis) && jenisById(pilihJenis).bidang === pilihBidang)) pilihJenis = null;
    renderChips(); renderChat(); renderSub();
  }

  function renderSub() {
    const hari = S.ymd(new Date());
    const n = kegiatan.filter(k => k.tanggal === hari).length;
    $('sub').textContent = (profil.nama ? profil.nama + ' · ' : '') + (n ? n + ' kegiatan hari ini' : 'belum ada kegiatan hari ini');
  }

  function renderChips() {
    const bd = $('bidang'); bd.innerHTML = '';
    S.BIDANG.forEach(n => { const b = document.createElement('button'); b.className = 'bd' + (pilihBidang === n ? ' on' : ''); b.textContent = n; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', pilihBidang === n);
      b.onclick = () => { if (pilihBidang !== n) { pilihBidang = n; pilihJenis = null; } simpanPref(); renderChips(); }; bd.appendChild(b); });
    const c = $('chips'); c.innerHTML = '';
    const mk = (label, on, fn, cls) => { const b = document.createElement('button'); b.className = 'chip' + (on ? ' on' : '') + (cls ? ' ' + cls : ''); b.textContent = label; b.title = label; b.onclick = fn; c.appendChild(b); return b; };
    if (!pilihBidang) { mk('↑ Pilih bidang kegiatan terlebih dahulu', false, () => { }, 'atur'); return; }
    jenisList.filter(j => j.bidang === pilihBidang).forEach(j => mk(j.nama, pilihJenis === j.id, () => { pilihJenis = pilihJenis === j.id ? null : j.id; simpanPref(); renderChips(); }));
    mk('+ Jenis baru', false, bukaJenisBaru, 'baru');
    setTimeout(() => { const on = c.querySelector('.chip.on') || null; on && on.scrollIntoView({ inline: 'nearest', block: 'nearest' }); const ob = bd.querySelector('.on'); ob && ob.scrollIntoView({ inline: 'nearest', block: 'nearest' }); }, 0);
  }
  function bukaJenisBaru() { $('jBidang').textContent = pilihBidang; $('jNama').value = ''; $('lapisJenis').classList.add('on'); setTimeout(() => $('jNama').focus(), 50); }
  $('jBatal').onclick = () => $('lapisJenis').classList.remove('on');
  $('lapisJenis').onclick = e => { if (e.target.id === 'lapisJenis') $('lapisJenis').classList.remove('on'); };
  $('jSimpan').onclick = async () => {
    const nama = $('jNama').value.trim(); if (!nama) { $('jNama').focus(); return; }
    const ada = jenisList.find(j => j.bidang === pilihBidang && j.nama.toLowerCase() === nama.toLowerCase());
    if (ada) { pilihJenis = ada.id; } else {
      const j = { id: 'j' + S.uid(), bidang: pilihBidang, nama };
      try { await S.put('jenis', j); jenisList.push(j); pilihJenis = j.id; } catch (e) { S.toast(e.message); return; }
    }
    simpanPref(); $('lapisJenis').classList.remove('on'); renderChips(); $('teks').focus();
  };

  const centang = '<svg viewBox="0 0 16 11"><path d="M11.07.65 4.98 7.3 2.4 4.73 1.33 5.8l3.68 3.68L12.14 1.7zM14.6.65 8.5 7.3l-.78-.78-1.06 1.07 1.87 1.87L15.67 1.7z"/></svg>';

  function renderChat() {
    const chat = $('chat');
    const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
    const list = kegiatan.slice().sort((a, b) => (a.tanggal + (a.jam || '') + a.dibuat).localeCompare(b.tanggal + (b.jam || '') + b.dibuat));
    const rmap = {}; rhkList.forEach((r, i) => rmap[r.id] = { r, i });
    let html = '<div class="info">📒 Catat kegiatan seperti mengirim pesan WhatsApp. Pilih <b>bidang</b> dan <b>jenis kegiatan</b> di atas kolom ketik — satu jenis kegiatan menjadi satu dokumen Bukti Dukung, lampirkan foto bukti dengan 📎 atau 📷, dan ketuk pesan untuk mengubah atau menghapus.</div>';
    let last = null, lastTs = 0;
    const show = list.slice(-400);
    for (const k of show) {
      let ekor = false;
      if (k.tanggal !== last) { html += `<div class="tgl-chip">${S.esc(S.labelHari(k.tanggal))}</div>`; last = k.tanggal; ekor = true; }
      else if ((k.dibuat || 0) - lastTs > 5 * 60000) ekor = true;
      lastTs = k.dibuat || 0;
      const rr = k.rhkId && rmap[k.rhkId];
      const jj = k.jenisId && jenisById(k.jenisId);
      const tag = k.bidang ? `<div class="tag" title="${S.esc(k.bidang + (jj ? ' · ' + jj.nama : ''))}">📁 <em>${S.esc(k.bidang)}</em><span>${jj ? '&nbsp;· ' + S.esc(jj.nama) : ''}</span></div><br>` : (rr ? `<div class="tag" title="${S.esc(rr.r.nama)}">🎯 <span>${rr.i + 1}. ${S.esc(rr.r.nama)}</span></div><br>` : '');
      const nf = (k.fotoIds || []).length;
      const fotos = nf ? `<div class="fotos n${Math.min(nf, 4) === 4 ? 4 : Math.min(nf, 3)}">${k.fotoIds.slice(0, nf > 4 ? 4 : nf).map(id => `<div class="ph" data-foto="${id}"></div>`).join('')}</div>` : '';
      html += `<div class="gel${ekor ? ' ekor' : ''}" data-id="${k.id}">${fotos}${tag}<span class="isi">${S.esc(k.teks || '')}</span><span class="meta">${S.esc(k.jam || '')} ${centang}</span></div>`;
    }
    chat.innerHTML = html;
    chat.querySelectorAll('[data-foto]').forEach(isiFoto);
    if (nearBottom || !renderChat.done) chat.scrollTop = chat.scrollHeight;
    renderChat.done = true;
  }

  async function ambilFoto(id) { if (!fotoCache.has(id)) fotoCache.set(id, S.get('foto', id)); return fotoCache.get(id); }
  async function isiFoto(el) {
    const f = await ambilFoto(el.dataset.foto); if (!f) return;
    const img = new Image(); img.src = f.data; img.alt = 'Foto bukti'; img.dataset.foto = el.dataset.foto;
    const chat = $('chat'); const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
    el.replaceWith(img); img.onload = () => { if (atBottom) chat.scrollTop = chat.scrollHeight; };
  }

  $('chat').addEventListener('click', e => {
    const im = e.target.closest('img[data-foto]');
    if (im) { $('viewer').querySelector('img').src = im.src; $('viewer').classList.add('on'); return; }
    const g = e.target.closest('.gel'); if (g) bukaEdit(g.dataset.id);
  });
  $('viewer').onclick = () => $('viewer').classList.remove('on');

  /* Input */
  const ta = $('teks');
  const autosize = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; };
  ta.addEventListener('input', autosize);
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); kirim(); } });
  $('kirim').onclick = kirim;
  $('btnLampir').onclick = () => $('fileGaleri').click();
  $('btnKamera').onclick = () => $('fileKamera').click();
  [$('fileGaleri'), $('fileKamera')].forEach(inp => inp.onchange = async () => {
    for (const f of [...inp.files].slice(0, 8)) { try { lampiran.push(await S.compressImage(f)); } catch (e) { S.toast('Foto gagal dibaca'); } }
    inp.value = ''; renderPratinjau();
  });
  function renderPratinjau() {
    const p = $('pratinjau'); p.classList.toggle('on', lampiran.length > 0); p.innerHTML = '';
    lampiran.forEach((f, i) => { const d = document.createElement('div'); d.innerHTML = `<img src="${f.data}" alt=""><button aria-label="Hapus foto">×</button>`; d.querySelector('button').onclick = () => { lampiran.splice(i, 1); renderPratinjau(); }; p.appendChild(d); });
  }

  let sibuk = false;
  async function kirim() {
    const teks = ta.value.trim();
    if (!teks && !lampiran.length) { ta.focus(); return; }
    if (sibuk) return; sibuk = true; $('kirim').disabled = true;
    try {
      const now = new Date();
      const fotoIds = [];
      for (const f of lampiran) { const id = 'f' + S.uid(); await S.put('foto', { id, data: f.data, w: f.w, h: f.h }); fotoIds.push(id); fotoCache.set(id, Promise.resolve({ id, data: f.data })); }
      const k = { id: 'k' + S.uid(), tanggal: tglCatat || S.ymd(now), jam: S.pad(now.getHours()) + ':' + S.pad(now.getMinutes()), teks: teks || '(foto bukti)', bidang: pilihBidang || null, jenisId: pilihJenis || null, rhkId: null, jumlah: 1, fotoIds, dibuat: Date.now() };
      await S.put('kegiatan', k);
      kegiatan.push(k); ta.value = ''; autosize(); lampiran = []; renderPratinjau();
      $('chat').scrollTop = $('chat').scrollHeight; renderChat(); $('chat').scrollTop = $('chat').scrollHeight; renderSub();
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) { }
    } catch (e) {
      S.toast(e && e.code === 'quota_exceeded' ? 'Penyimpanan penuh — hapus beberapa foto lama.' : 'Gagal menyimpan: ' + (e && e.message || e));
    } finally { sibuk = false; $('kirim').disabled = false; }
  }

  /* Catat untuk tanggal lain */
  $('btnTgl').onclick = () => { const p = $('tglPick'); p.value = tglCatat || S.ymd(new Date()); p.max = S.ymd(new Date()); if (p.showPicker) { try { p.showPicker(); return; } catch (e) { } } p.style.pointerEvents = 'auto'; p.focus(); p.click(); };
  $('tglPick').onchange = () => { const v = $('tglPick').value; setTgl(v && v !== S.ymd(new Date()) ? v : null); };
  $('bannerX').onclick = () => setTgl(null);
  function setTgl(v) { tglCatat = v; $('banner').classList.toggle('on', !!v); if (v) $('bannerTeks').textContent = '📅 Mencatat untuk ' + S.tglPanjang(v); ta.placeholder = v ? 'Ketik kegiatan tanggal ' + S.tglSedang(v) + '…' : 'Ketik kegiatan hari ini…'; }

  /* Ubah / hapus */
  function bukaEdit(id) {
    const k = kegiatan.find(x => x.id === id); if (!k) return; editing = JSON.parse(JSON.stringify(k));
    $('eTeks').value = k.teks || ''; $('eTgl').value = k.tanggal; $('eJam').value = k.jam || ''; $('eJml').value = k.jumlah || 1;
    $('eRhk').innerHTML = '<option value="">— Tanpa RK —</option>' + rhkList.map((r, i) => `<option value="${r.id}">${i + 1}. ${S.esc(r.nama)}${r.satuan ? ' (' + S.esc(r.satuan) + ')' : ''}</option>`).join('');
    $('eRhk').value = k.rhkId || ''; $('eRkBox').hidden = !rhkList.length;
    $('eBidang').innerHTML = '<option value="">— Pilih bidang —</option>' + S.BIDANG.map(b => `<option>${b}</option>`).join(''); $('eBidang').value = k.bidang || '';
    isiJenisEdit(k.jenisId);
    const ef = $('eFoto'); ef.innerHTML = (k.fotoIds || []).length ? '' : '<small style="color:#667781">Tidak ada foto</small>';
    (k.fotoIds || []).forEach(fid => { const w = document.createElement('div'); w.style.position = 'relative'; w.innerHTML = `<img alt=""><button aria-label="Hapus foto" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#3b4a54;color:#fff;cursor:pointer">×</button>`;
      ambilFoto(fid).then(f => f && (w.querySelector('img').src = f.data));
      w.querySelector('button').onclick = () => { editing.fotoIds = editing.fotoIds.filter(x => x !== fid); editing._hapusFoto = (editing._hapusFoto || []).concat(fid); w.remove(); };
      ef.appendChild(w); });
    $('konfirmasi').style.display = 'none'; $('lapisEdit').classList.add('on');
  }
  function isiJenisEdit(sel) { const b = $('eBidang').value; $('eJenis').innerHTML = '<option value="">— Tanpa jenis —</option>' + jenisList.filter(j => j.bidang === b).map(j => `<option value="${j.id}">${S.esc(j.nama)}</option>`).join(''); $('eJenis').value = jenisList.some(j => j.id === sel && j.bidang === b) ? sel : ''; }
  $('eBidang').onchange = () => isiJenisEdit(null);
  const tutupEdit = () => { $('lapisEdit').classList.remove('on'); editing = null; };
  $('eBatal').onclick = tutupEdit;
  $('lapisEdit').onclick = e => { if (e.target.id === 'lapisEdit') tutupEdit(); };
  $('eSimpan').onclick = async () => {
    if (!editing) return;
    const hapus = editing._hapusFoto || []; delete editing._hapusFoto;
    Object.assign(editing, { teks: $('eTeks').value.trim() || '(foto bukti)', tanggal: $('eTgl').value || editing.tanggal, jam: $('eJam').value, bidang: $('eBidang').value || null, jenisId: $('eJenis').value || null, rhkId: $('eRhk').value || null, jumlah: Math.max(1, parseInt($('eJml').value) || 1) });
    try { await S.put('kegiatan', editing); for (const f of hapus) await S.del('foto', f); const i = kegiatan.findIndex(x => x.id === editing.id); kegiatan[i] = editing; tutupEdit(); renderChat(); renderSub(); S.toast('Kegiatan diperbarui'); }
    catch (e) { S.toast('Gagal menyimpan'); }
  };
  $('eHapus').onclick = () => { $('konfirmasi').style.display = 'flex'; };
  $('kTidak').onclick = () => { $('konfirmasi').style.display = 'none'; };
  $('kYa').onclick = async () => {
    const k = kegiatan.find(x => x.id === editing.id);
    try { await S.hapusKegiatan(k); kegiatan = kegiatan.filter(x => x.id !== k.id); tutupEdit(); renderChat(); renderSub(); S.toast('Kegiatan dihapus'); } catch (e) { S.toast('Gagal menghapus'); }
  };

  /* Pasang ke HP (PWA) */
  let promptPasang = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptPasang = e; $('pasang').classList.add('on'); });
  $('pasang').onclick = async () => { if (!promptPasang) return; promptPasang.prompt(); await promptPasang.userChoice; promptPasang = null; $('pasang').classList.remove('on'); };

  let masuk = false;
  const segarkan = () => { if (masuk && !$('lapisEdit').classList.contains('on')) muat().catch(e => S.toast(e.message)); };
  S.onChange(segarkan);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) segarkan(); });
  S.registerSW();
  S.mulai().then(({ pegawai }) => { if (pegawai.peran === 'admin') { location.replace('admin.html'); return; } masuk = true; return muat(); }).catch(e => S.toast(e.message, 6000));
})();
</script>
</body>
</html>
